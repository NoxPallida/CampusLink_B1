<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLink - Déclarer un incident</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <a href="../index.html" class="logo">CampusLink</a>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="dashboard.html">Tableau de bord</a></li>
        <li><a href="salles.html">Salles</a></li>
        <li><a href="equipements.html">Équipements</a></li>
        <li><a href="incident.html">Incidents</a></li>
        <li><a href="declaration.html" class="active btn">Déclarer un incident</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Déclarer un nouvel incident</h1>

    <section class="card">
      <form action="#" method="get">
        <div class="form-group">
          <label for="titre">Titre de l'incident *</label>
          <input type="text" id="titre" name="titre" required placeholder="ex: Écran cassé, Problème Wi-Fi...">
        </div>

        <div class="form-group">
          <label for="salle">Salle concernée *</label>
          <select id="salle" name="salle" required>
            <option value="">-- Sélectionnez une salle --</option>
            <option value="A101">Salle A101</option>
            <option value="B102">Salle B102</option>
            <option value="C03">Labo Réseau C03</option>
          </select>
        </div>

        <div class="form-group">
          <label for="equipement">Équipement (optionnel)</label>
          <select id="equipement" name="equipement">
            <option value="">-- Sélectionnez un équipement --</option>
            <option value="EQ-VP-01">Vidéoprojecteur Epson</option>
            <option value="EQ-PC-15">PC Tour Dell</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priorite">Priorité *</label>
          <select id="priorite" name="priorite" required>
            <option value="Basse">Basse</option>
            <option value="Moyenne" selected>Moyenne</option>
            <option value="Haute">Haute</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description détaillée *</label>
          <textarea id="description" name="description" rows="5" required placeholder="Décrivez le problème constaté..."></textarea>
        </div>

        <button type="submit" class="btn">Soumettre le signalement</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CampusLink - Projet Fil Rouge B1 Ynov</p>
  </footer>
</body>
</html>
